name: Deploy Web (Cloudflare Pages)

# apps/admin only. apps/customer and apps/driver are Expo/native — a separate
# EAS/App Store/Google Play track, never Pages. apps/merchant is still an
# Expo shell (DEC-APP-003 conversion has not happened) and has no Pages
# target yet — this workflow does not build or deploy it.
#
# See .github/workflows/deploy-api.yml for the full reasoning behind gating
# on workflow_run + head_sha rather than a raw push trigger; identical logic
# applies here.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  # Manual trigger, deliberately with NO `inputs:`. Every value this workflow
  # deploys with — Cloudflare account, Pages project, the token itself —
  # comes from the `production` GitHub Environment, never from the person
  # dispatching. See deploy-api.yml for the full reasoning; identical here.
  workflow_dispatch:

concurrency:
  group: deploy-web-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy apps/admin to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production

    # A manual `workflow_dispatch` is admitted as a separate branch of this
    # condition, restricted to main. See deploy-api.yml for the identical
    # pattern and reasoning.
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')

    steps:
      - name: Checkout the exact commit CI tested
        uses: actions/checkout@v4
        with:
          # On workflow_run: the exact commit CI tested. On workflow_dispatch:
          # github.sha, the tip of main (the only ref the job condition admits).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # See deploy-api.yml for why the parent must be resolved to a plain SHA
      # before paths-filter sees it (dorny/paths-filter#252).
      - name: Resolve base commit for path filtering
        if: github.event_name == 'workflow_run'
        id: base
        run: echo "sha=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"

      - name: Detect apps/admin-relevant changes
        if: github.event_name == 'workflow_run'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            web:
              - 'apps/admin/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'

      # The single gate every deployment step below reads. Two modes, one
      # decision — see deploy-api.yml for the full reasoning, identical here.
      - name: Decide whether to deploy
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'Manual dispatch — deploying the current main regardless of changed paths.'
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo 'workflow_run — deploying only if apps/admin-relevant paths changed.'
            echo "deploy=${{ steps.filter.outputs.web }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable pnpm
        if: steps.gate.outputs.deploy == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0 # matches package.json "packageManager", ci.yml

      - name: Set up Node
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build apps/admin (and its workspace dependencies)
        if: steps.gate.outputs.deploy == 'true'
        # Turborepo-aware build: the trailing `...` pulls in @banhao/ui,
        # @banhao/types, etc. per turbo.json's build.dependsOn — the same
        # dependency graph `pnpm build` already walks at the repo root, just
        # scoped to what apps/admin needs. `next.config.mjs` sets
        # `output: 'export'` (locked in docs/DEPLOYMENT-ARCHITECTURE-V1.md
        # §6), which is what makes apps/admin/out exist below.
        run: pnpm exec turbo run build --filter=@banhao/admin...

      - name: Verify static export exists
        if: steps.gate.outputs.deploy == 'true'
        run: test -f apps/admin/out/index.html

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy apps/admin/out
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main
        # main → production is Pages' own convention for the `--branch=main`
        # deployment; this workflow never runs for a pull_request (see the
        # workflow_run gate above), so no PR can reach a production deploy.
