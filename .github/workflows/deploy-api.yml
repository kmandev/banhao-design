name: Deploy API

# Gated on CI (.github/workflows/ci.yml, workflow name "CI") having completed
# successfully — not on a raw push to main. See the safety notes on the `if`
# condition and the checkout step below; both exist to satisfy the same
# requirement: never deploy a commit that did not pass CI, and never deploy a
# commit other than the one CI actually tested.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  # Manual trigger, deliberately with NO `inputs:`. Every value this workflow
  # deploys with — project, region, Artifact Registry repo, Cloud Run service,
  # both service accounts, the Secret Manager references — comes from the
  # `production` GitHub Environment, never from the person dispatching. There
  # is therefore nothing a dispatcher can redirect, and no free-text field that
  # reaches a shell or a gcloud flag. The only thing a dispatch decides is
  # *whether* to deploy the current main, not *where* or *as whom*.
  #
  # Note this path does NOT verify that CI passed for the commit; it is for
  # deploying an already-CI-green main when the path filter legitimately found
  # no application change (e.g. proving the pipeline end to end). Confirm CI is
  # green on main before dispatching.
  workflow_dispatch:

concurrency:
  group: deploy-api-main
  # A half-finished deploy should be allowed to finish, then the next one
  # runs — not be cancelled mid-flight (docs/DEPLOYMENT-ARCHITECTURE-V1.md).
  cancel-in-progress: false

permissions:
  contents: read
  # Required for google-github-actions/auth's Workload Identity Federation —
  # no service-account key exists anywhere in this repository or its secrets.
  id-token: write

jobs:
  deploy:
    name: Build, push, and deploy apps/api to Cloud Run
    runs-on: ubuntu-latest
    environment: production

    # Three independent conditions, all required:
    #   1. conclusion == 'success' — CI actually passed for this commit.
    #   2. head_branch == 'main'   — the CI run this fired for was itself a
    #      run against main, not a pull_request run (a PR's CI run reports
    #      head_branch as the PR's source branch, never "main"), so this
    #      alone keeps every PR from ever reaching this job.
    #   3. event == 'push'         — belt-and-suspenders: only a direct push
    #      to main (never any other event shape) can satisfy this workflow.
    #
    # Note also that ci.yml's own `concurrency: cancel-in-progress: true` on
    # `${{ github.workflow }}-${{ github.ref }}` means an in-flight CI run for
    # an old commit on main is cancelled (conclusion: cancelled, not success)
    # the moment a newer commit is pushed — so the "stale successful run"
    # hazard is unlikely to occur in the first place under this repo's CI
    # config. This job's checkout-by-head_sha (below) closes the gap
    # completely regardless: it always deploys the exact commit CI tested,
    # never whatever main's tip happens to be when this job runs.
    #
    # A manual `workflow_dispatch` is admitted as a separate branch of this
    # condition, restricted to main. That `github.ref` check is defence in
    # depth, not the only control: the WIF provider's own attribute condition
    # already refuses to issue a token for any ref other than refs/heads/main,
    # so a dispatch from another branch fails at authentication regardless.
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')

    steps:
      - name: Checkout the exact commit CI tested
        uses: actions/checkout@v4
        with:
          # On workflow_run: the exact commit CI tested. On workflow_dispatch:
          # github.sha, the tip of main (the only ref the job condition admits).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # full history — needed for the path-filter diff below

      # paths-filter never interprets `^`: it pattern-matches `base` with
      # `git show-ref`, then falls back to passing it verbatim to
      # `git fetch` as a refspec — and `^` is invalid in both. `git rev-parse`
      # *does* understand it, so the parent is resolved to a plain 40-char SHA
      # here and handed over as a literal (dorny/paths-filter#252). The
      # checkout above uses fetch-depth 0, so the parent commit is present.
      - name: Resolve base commit for path filtering
        if: github.event_name == 'workflow_run'
        id: base
        run: echo "sha=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"

      - name: Detect apps/api-relevant changes
        if: github.event_name == 'workflow_run'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Diffs against this commit's parent. Assumes a linear main history
          # (single-commit or squash pushes) — true of this repo's workflow
          # to date. A worst-case false positive here means one redundant,
          # harmless redeploy of an unchanged image; it is not a correctness
          # or security risk, so no more elaborate mechanism is used.
          base: ${{ steps.base.outputs.sha }}
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'

      # The single gate every deployment step below reads. Two modes, one
      # decision:
      #   workflow_run      → deploy exactly when the path filter matched,
      #                       i.e. unchanged from the behaviour before manual
      #                       dispatch existed.
      #   workflow_dispatch → deploy unconditionally. The filter steps above
      #                       are skipped in this mode (there is no meaningful
      #                       "parent commit" diff to consult when the trigger
      #                       is a human, not a push), so `steps.filter` has no
      #                       output here and is deliberately not read.
      - name: Decide whether to deploy
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'Manual dispatch — deploying the current main regardless of changed paths.'
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo 'workflow_run — deploying only if apps/api-relevant paths changed.'
            echo "deploy=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: steps.gate.outputs.deploy == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA_EMAIL }}
          # No credentials_json input — WIF issues a short-lived token via
          # OIDC. No long-lived key exists anywhere.

      - name: Set up Cloud SDK
        if: steps.gate.outputs.deploy == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: steps.gate.outputs.deploy == 'true'
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Compute the immutable image tag
        if: steps.gate.outputs.deploy == 'true'
        id: image
        run: |
          echo "tag=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/banhao-api:${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
        # The commit SHA is the deployment identity — never `latest`.

      - name: Build API image (linux/amd64)
        if: steps.gate.outputs.deploy == 'true'
        # Same Dockerfile CI already build-validates (ci.yml `docker` job) and
        # A-7 verified end-to-end. Not modified here. Built from the repo
        # root, exactly as the Dockerfile's own header comment specifies.
        # No --build-arg / -e of any kind: the image accepts no secrets at
        # build time, and none are given here either. Runtime secrets are
        # injected by Cloud Run from Secret Manager in the deploy step below.
        run: |
          docker build \
            --platform linux/amd64 \
            -f apps/api/Dockerfile \
            -t "${{ steps.image.outputs.tag }}" \
            .

      - name: Push image to Artifact Registry
        if: steps.gate.outputs.deploy == 'true'
        run: docker push "${{ steps.image.outputs.tag }}"

      - name: Deploy to Cloud Run
        if: steps.gate.outputs.deploy == 'true'
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ steps.image.outputs.tag }}
          # DEC-APP-009: min=0/max=5, request-based billing. --allow-unauthenticated
          # is required (docs/DEPLOYMENT-ARCHITECTURE-V1.md §2) — /webhooks/*
          # and /internal/tick must be reachable by parties with no Google
          # identity. Every route stays behind its own application-level
          # guard (SupabaseAuthGuard / TickHmacGuard / provider signature)
          # regardless of network-level accessibility.
          #
          # --port=8080 matches Cloud Run's default container port. PORT is a
          # reserved env var Cloud Run injects itself — it is deliberately
          # NOT set in `env_vars` below; apps/api already reads it correctly
          # via packages/config/src/env.ts (verified in A-7).
          #
          # --service-account: without this, Cloud Run defaults to the
          # project's default compute service account (roles/editor — far
          # broader than this app needs). banhao-runtime holds only
          # roles/secretmanager.secretAccessor, matching the `secrets:` block
          # below and nothing else (Stage 4 pre-deployment audit finding).
          flags: --min-instances=0 --max-instances=5 --allow-unauthenticated --port=8080 --service-account=${{ vars.GCP_RUNTIME_SA_EMAIL }}
          secrets: |
            SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest
            SUPABASE_JWT_SECRET=SUPABASE_JWT_SECRET:latest
            INTERNAL_TICK_SECRET=INTERNAL_TICK_SECRET:latest
          env_vars: |
            NODE_ENV=production
            SUPABASE_URL=${{ vars.SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
            CORS_ORIGINS=${{ vars.CORS_ORIGINS }}

      - name: Smoke test — GET /health
        if: steps.gate.outputs.deploy == 'true'
        run: |
          url="${{ steps.deploy.outputs.url }}/health"
          body="$(curl --fail --silent --show-error "$url")"
          echo "$body" | grep -q '"success":true' || { echo "::error::/health did not report success:true — $body"; exit 1; }
          # `/health` answers 200 even when its database ping fails, so that a
          # database outage cannot make Cloud Run crash-loop a healthy process
          # (see HealthResponse). A deploy is a different question: an API that
          # cannot reach its database is not deployed successfully, so the
          # degraded case is checked explicitly and named in the error.
          echo "$body" | grep -q '"database":{"status":"ok"' || { echo "::error::/health reports the database unreachable — the service is up but cannot serve a real request. $body"; exit 1; }
          echo "$body" | grep -q '"status":"ok"' || { echo "::error::/health did not report status:ok — $body"; exit 1; }
          echo "Smoke test passed: $url"
        # Payment processing is deliberately not exercised here — Q-001 is
        # OPEN and no payment credential exists to test against.
