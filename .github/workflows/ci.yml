name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  rls:
    name: Verify database RLS policies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run RLS verification
        # Applies the auth shim and every migration to a throwaway Postgres,
        # then asserts the authorization rules. Fails the build on any
        # regression in profile access control.
        run: ./supabase/tests/run-rls-tests.sh

  domain:
    name: Verify database domain invariants
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run domain verification
        # The other half of the SQL suite, and until now the half nothing ran
        # automatically: identity/cart/order snapshot invariants, the rider
        # views' row isolation, catalog availability visibility, the rider
        # race proven with two genuinely concurrent psql processes, rider
        # reassignment atomicity, and create_order()'s full assertion set.
        # Same throwaway-Postgres model as the RLS job — it applies the auth
        # shim and every migration to a container and touches no real project.
        run: ./supabase/tests/run-domain-tests.sh

  docker:
    name: Build API image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        # Build only — no push. Deployment is out of scope for the foundation.
        run: docker build -f apps/api/Dockerfile -t banhao-api:ci .

  secrets-scan:
    name: Check for committed secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fail if a .env or credential file is tracked
        run: |
          # AGENTS.md: no secrets in Git, ever. This is a cheap backstop for
          # the most common accidental commits.
          if git ls-files | grep -E '(^|/)\.env($|\.)|service-account.*\.json|credentials\.json|\.(pem|p12|p8|keystore)$' | grep -v '\.env\.example'; then
            echo "::error::A secret-bearing file is tracked in Git. Remove it and rotate the credential."
            exit 1
          fi
          echo "No secret-bearing files tracked."
